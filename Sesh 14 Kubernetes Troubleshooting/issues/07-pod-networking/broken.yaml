# the app only listens on 127.0.0.1, so other Pods can't reach it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: s14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python3", "-m", "http.server", "8000", "--bind", "127.0.0.1"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: s14
spec:
  selector:
    app: inventory-api
  ports:
    - port: 80
      targetPort: 8000
