apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-settings
  namespace: s14
data:
  max_loan_days: "14"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-app
  namespace: s14
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo MAX_LOAN_DAYS=$MAX_LOAN_DAYS; sleep 3600"]
      env:
        - name: MAX_LOAN_DAYS
          valueFrom:
            configMapKeyRef:
              name: loan-settings
              key: MAX_LOAN_DAYS      # wrong: the key is max_loan_days (keys are case-sensitive)
