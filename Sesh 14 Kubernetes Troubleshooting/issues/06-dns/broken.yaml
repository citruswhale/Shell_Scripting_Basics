apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  namespace: s14
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: curlimages/curl:8.11.1
      command: ["sh", "-c", "curl -s -m 5 -w '\\nHTTP %{http_code}\\n' http://gear-web.default.svc.cluster.local || echo \"curl failed with exit $?\""]
