apiVersion: v1
kind: Namespace
metadata:
  name: s14
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gear-web
  namespace: s14
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gear-web
  template:
    metadata:
      labels:
        app: gear-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gear-web
  namespace: s14
spec:
  selector:
    app: gear-web
  ports:
    - port: 80
      targetPort: 80
