# Tells Argo CD to keep the cluster in sync with gitops/app/ in my GitHub repo.
# Kept outside app/ so it is not part of the manifests it deploys.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gear-status
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/citruswhale/Shell_Scripting_Basics.git
    targetRevision: master
    path: "Sesh 20 Monitoring GitOps/gitops/app"
  destination:
    server: https://kubernetes.default.svc
    namespace: s20-gitops
  syncPolicy:
    automated:
      prune: true      # delete things that were removed from git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
