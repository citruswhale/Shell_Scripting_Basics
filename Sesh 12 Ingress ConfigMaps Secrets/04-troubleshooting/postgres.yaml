# a small PostgreSQL. Its password comes from the Secret "pg-server".
apiVersion: v1
kind: Secret
metadata:
  name: pg-server
  namespace: s12
type: Opaque
data:
  POSTGRES_PASSWORD: bGFiUGFzczEyMw==      # echo -n "labPass123" | base64   (lab-only value)
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: s12
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:17-alpine
      env:
        - name: POSTGRES_USER
          value: gearloan
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pg-server
              key: POSTGRES_PASSWORD
      ports:
        - containerPort: 5432
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "gearloan"]
        periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: s12
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
