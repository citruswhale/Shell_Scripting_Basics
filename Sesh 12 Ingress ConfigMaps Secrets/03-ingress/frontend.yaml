apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: s12
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=GearLoan frontend (home page)"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: s12
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
