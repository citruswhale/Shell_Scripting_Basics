apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: s12
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        # one key -> one variable
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
      # all keys -> variables at once
      envFrom:
        - configMapRef:
            name: app-config
      volumeMounts:
        - name: config-files
          mountPath: /etc/app
          readOnly: true
  volumes:
    - name: config-files
      configMap:
        name: app-config
        items:
          - key: settings.ini
            path: settings.ini
