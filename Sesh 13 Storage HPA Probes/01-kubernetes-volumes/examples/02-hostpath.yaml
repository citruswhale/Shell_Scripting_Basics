# hostPath: a folder on the node itself. Data stays on that node only.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: s13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"written by $(hostname) at $(date)\" >> /node-data/notes.txt; sleep 3600"]
      volumeMounts:
        - name: node-folder
          mountPath: /node-data
  volumes:
    - name: node-folder
      hostPath:
        path: /tmp/s13-hostpath
        type: DirectoryOrCreate
