# dynamic provisioning: no PV written by hand, the StorageClass makes one
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: s13-fast
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Delete
volumeBindingMode: Immediate   # minikube-hostpath only supports Immediate (on EKS I would use WaitForFirstConsumer)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-claim
  namespace: s13
spec:
  storageClassName: s13-fast
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-user
  namespace: s13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
        - name: manual
          mountPath: /manual
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-claim
    - name: manual
      persistentVolumeClaim:
        claimName: manual-claim
