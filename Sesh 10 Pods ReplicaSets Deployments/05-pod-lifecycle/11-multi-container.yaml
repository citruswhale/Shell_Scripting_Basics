apiVersion: v1
kind: Pod
metadata:
  name: life-multi
  namespace: s10
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
    - name: log-reader        # sidecar that reads the web container's log
      image: busybox:1.36
      command: ["sh", "-c", "touch /logs/access.log; tail -f /logs/access.log"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  volumes:
    - name: logs
      emptyDir: {}
