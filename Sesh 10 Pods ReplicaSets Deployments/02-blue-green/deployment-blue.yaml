apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: s10
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-bg
      color: blue
  template:
    metadata:
      labels:
        app: web-bg
        color: blue
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=BLUE - version 1"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
