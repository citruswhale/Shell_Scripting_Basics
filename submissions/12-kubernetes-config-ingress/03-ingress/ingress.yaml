apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gearloan
  namespace: s12
spec:
  ingressClassName: nginx            # handled by the ingress-nginx controller
  rules:
    # path-based routing on one host
    - host: gearloan.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # host-based routing: a second host goes to a different Service
    - host: admin.gearloan.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
