apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: s12
data:
  # simple key-value pairs (used as environment variables)
  APP_NAME: "GearLoan"
  APP_ENV: "staging"
  LOG_LEVEL: "info"
  MAX_LOAN_DAYS: "14"
  # a whole file (mounted as /etc/app/settings.ini)
  settings.ini: |
    [loans]
    max_items_per_person = 3
    overdue_reminder_hours = 24
