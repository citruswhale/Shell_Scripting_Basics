apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-calculator
  namespace: s17
  labels:
    app: loan-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-calculator
  template:
    metadata:
      labels:
        app: loan-calculator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loan-calculator
          # The pipeline swaps this for the scanned image tagged with the commit SHA
          image: ghcr.io/citruswhale/s17-loan-calculator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_COMMIT
              value: "unknown"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            # Writable /tmp because the root filesystem is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
