apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "gear-catalog.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gear-catalog.selector" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
