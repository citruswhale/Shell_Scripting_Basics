# static provisioning: an admin creates the PV by hand first
apiVersion: v1
kind: PersistentVolume
metadata:
  name: s13-manual-pv
spec:
  capacity:
    storage: 200Mi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /tmp/s13-manual-pv
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-claim
  namespace: s13
spec:
  storageClassName: manual       # only binds to PVs with this class
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
