# 3 Pods that call the web Service in a tight loop
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: s13-hpa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://web; done"]
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 300m, memory: 32Mi }
