apiVersion: v1
kind: Pod
metadata:
  name: life-startup
  namespace: s10
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'slow start...'; sleep 25; touch /tmp/started; echo 'started'; sleep 3600"]
      startupProbe:
        exec:
          command: ["test", "-f", "/tmp/started"]
        periodSeconds: 5
        failureThreshold: 10    # gives the app up to 50 seconds to start
      livenessProbe:
        exec:
          command: ["test", "-f", "/tmp/started"]
        periodSeconds: 5
