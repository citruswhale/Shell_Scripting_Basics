apiVersion: v1
kind: Pod
metadata:
  name: life-readiness
  namespace: s10
spec:
  containers:
    - name: app
      image: busybox:1.36
      # becomes "ready" only after 20 seconds, when /tmp/ready appears
      command: ["sh", "-c", "sleep 20; touch /tmp/ready; sleep 3600"]
      readinessProbe:
        exec:
          command: ["test", "-f", "/tmp/ready"]
        periodSeconds: 3
