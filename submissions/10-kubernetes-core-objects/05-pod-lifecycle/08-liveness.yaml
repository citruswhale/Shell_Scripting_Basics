apiVersion: v1
kind: Pod
metadata:
  name: life-liveness
  namespace: s10
spec:
  containers:
    - name: app
      image: busybox:1.36
      # healthy for 15 seconds, then the health file is removed
      command: ["sh", "-c", "touch /tmp/healthy; sleep 15; rm /tmp/healthy; sleep 3600"]
      livenessProbe:
        exec:
          command: ["test", "-f", "/tmp/healthy"]
        initialDelaySeconds: 3
        periodSeconds: 3
        failureThreshold: 2
