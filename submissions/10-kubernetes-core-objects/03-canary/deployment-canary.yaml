apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  namespace: s10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-canary
      track: canary
  template:
    metadata:
      labels:
        app: web-canary
        track: canary
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=CANARY - version 2"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
