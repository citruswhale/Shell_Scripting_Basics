# EKS: images from GHCR, gp3 EBS volume, ingress-nginx, Prometheus scraping.
# Used by k8s/argocd/application.yaml.

image:
  registry: ghcr.io/citruswhale
  pullPolicy: IfNotPresent

# ---- Set by CI (.github/workflows/capstone-ci-cd.yml, gitops-update job) ----
# Every green push to master writes the full commit SHA of the scanned images
# into the three lines marked "# ci:..." and commits it. Argo CD sees the
# change and rolls the new images out. Do not edit those lines by hand.
# "set-by-ci" is only a placeholder: no image has this tag, so the first
# pipeline run on master has to replace it before Argo CD can start the pods.
backend:
  image:
    tag: "set-by-ci" # ci:backend-tag
  # Shown by /api/info, e.g. 1.0.0-abc1234 (chart appVersion + short SHA)
  appVersion: "set-by-ci" # ci:backend-version

frontend:
  image:
    tag: "set-by-ci" # ci:frontend-tag
# ---- end of CI managed fields ----

postgres:
  # Argo CD renders with "helm template", where lookup does not work, so a
  # generated password would change on every sync. Create this Secret once
  # by hand (see k8s/README.md) and the chart only reads it.
  existingSecret: gearloan-db
  storage:
    size: 5Gi
    storageClassName: gp3

ingress:
  className: nginx
  host: ""    # set to your domain if you have one

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
