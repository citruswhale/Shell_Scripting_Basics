apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gearloan.frontend.fullname" . }}
  labels:
    {{- include "gearloan.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  # No replicas field when the HPA is on, so Helm/Argo CD don't fight the HPA
  {{- if not .Values.frontend.hpa.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "gearloan.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gearloan.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gearloan.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: {{ .Values.frontend.runAsUser }}
        runAsGroup: {{ .Values.frontend.runAsUser }}
      containers:
        - name: frontend
          image: {{ include "gearloan.image" (dict "ctx" . "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
          env:
            # Used by nginx/default.conf.template to proxy /api to the backend
            - name: BACKEND_UPSTREAM
              value: "{{ include "gearloan.backend.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.port }}"
            - name: NGINX_RESOLVER
              value: {{ .Values.frontend.nginxResolver | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # Root filesystem is read-only; nginx needs these two writable
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # The image writes default.conf here from the template at start-up
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
