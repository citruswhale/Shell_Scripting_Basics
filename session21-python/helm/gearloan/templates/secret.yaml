{{- if not .Values.postgres.existingSecret }}
{{- /*
Password order: value passed in > password already in the cluster > new random one.
lookup keeps the random password the same on every helm upgrade.
(lookup returns nothing under "helm template" / Argo CD, so use existingSecret there.)
*/}}
{{- $secretName := include "gearloan.postgres.secretName" . }}
{{- $password := .Values.postgres.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (index $existing.data "postgres-password") }}
{{- $password = index $existing.data "postgres-password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "gearloan.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  postgres-password: {{ $password | b64enc | quote }}
{{- end }}
