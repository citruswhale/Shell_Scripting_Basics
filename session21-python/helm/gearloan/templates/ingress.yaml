{{- if .Values.ingress.enabled }}
# /api goes to the backend, everything else to the frontend (React app)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gearloan.fullname" . }}
  labels:
    {{- include "gearloan.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "gearloan.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gearloan.frontend.fullname" . }}
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
