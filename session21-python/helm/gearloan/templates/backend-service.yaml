apiVersion: v1
kind: Service
metadata:
  name: {{ include "gearloan.backend.fullname" . }}
  labels:
    {{- include "gearloan.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "gearloan.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    # Port name "http" is what the ServiceMonitor scrapes
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
