{{- if .Values.serviceAccount.create }}
# The app does not call the Kubernetes API, so no token is mounted
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gearloan.serviceAccountName" . }}
  labels:
    {{- include "gearloan.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
