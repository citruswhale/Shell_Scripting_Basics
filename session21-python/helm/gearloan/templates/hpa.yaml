{{- range $part := list "backend" "frontend" }}
{{- $cfg := index $.Values $part }}
{{- if $cfg.hpa.enabled }}
---
# Scales the {{ $part }} on CPU (needs metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gearloan.fullname" $ }}-{{ $part }}
  labels:
    {{- include "gearloan.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $part }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gearloan.fullname" $ }}-{{ $part }}
  minReplicas: {{ $cfg.hpa.minReplicas }}
  maxReplicas: {{ $cfg.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.hpa.targetCPUUtilizationPercentage }}
  behavior:
    # Wait 5 minutes of low load before removing pods
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}
