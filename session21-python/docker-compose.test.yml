# Throwaway Postgres used only by the pytest suite.
# Start:  docker compose -f docker-compose.test.yml up -d
# Stop:   docker compose -f docker-compose.test.yml down -v
name: gearloan-test

services:
  test-db:
    image: postgres:17-alpine
    container_name: gearloan-test-db
    environment:
      POSTGRES_USER: gearloan
      POSTGRES_PASSWORD: gearloan
      POSTGRES_DB: gearloan_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data  # nothing to keep, so keep it in memory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearloan -d gearloan_test"]
      interval: 2s
      timeout: 3s
      retries: 15
